name: Supabase Keepalive

# Supabase free tier mem-pause project yang idle ~7 hari.
# Workflow ini query database tiap 3 hari supaya project tetap aktif.
on:
  schedule:
    - cron: "0 1 */3 * *" # 01:00 UTC (08:00 WIB), setiap 3 hari
  workflow_dispatch: # bisa dijalankan manual dari tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secret SUPABASE_URL / SUPABASE_ANON_KEY belum di-set."
            exit 1
          fi

          status=$(curl -s -o response.txt -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/lahan?select=id_lahan&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            cat response.txt
            echo "::error::Supabase tidak merespons 200 (mungkin sudah ke-pause)."
            exit 1
          fi
          echo "Supabase aktif ✅"
